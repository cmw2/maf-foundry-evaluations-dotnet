name: .NET Foundry evaluations
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Agent to evaluate (negative intentionally fails the quality gate)
        type: choice
        options: [maf, prompt, negative]
        default: maf
      runner:
        description: Hosted runner, or an explicitly provisioned temporary synthetic-validation runner
        type: choice
        options: [hosted, temporary-validation]
        default: hosted
      upload_artifacts:
        description: Upload raw result artifacts (requires available GitHub Actions storage)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  checks: write

jobs:
  evaluate:
    runs-on: ${{ inputs.runner == 'temporary-validation' && fromJSON('["self-hosted","Windows","X64","dotnet-eval-validation"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
      FOUNDRY_JUDGE_MODEL: ${{ vars.FOUNDRY_JUDGE_MODEL }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
      FOUNDRY_AGENT_VERSION: ${{ vars.FOUNDRY_AGENT_VERSION }}
      EVAL_OUTPUT: results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Evaluate and enforce quality gate
        shell: pwsh
        env:
          EVAL_MODE: ${{ inputs.mode }}
        run: |
          dotnet run --project tests/EvalValidation.csproj -- $env:EVAL_MODE
          exit $LASTEXITCODE
      - name: Publish individual evaluation test cases
        if: always()
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451
        with:
          name: Foundry quality tests
          path: results/*-junit.xml
          reporter: java-junit
          use-actions-summary: 'false'
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Preserve scores and Foundry report link
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evaluation-${{ inputs.mode }}-${{ github.run_id }}
          path: results/
          if-no-files-found: error
